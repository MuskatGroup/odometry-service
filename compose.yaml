services:
  reserve:
    image: reserve-odometry:submission
    build:
      context: .
      dockerfile: infra/Dockerfile.ros
    cpus: 2
    mem_limit: 512m
    environment:
      ROS_DOMAIN_ID: "75"
    volumes:
      - ./artifacts:/artifacts

  ros-tests:
    profiles: ["test"]
    image: reserve-odometry:submission
    build:
      context: .
      dockerfile: infra/Dockerfile.ros
    command: ["python3", "-m", "pytest", "-q", "tests"]
    environment:
      ROS_DOMAIN_ID: "73"
      RUN_ROS_TESTS: "1"
