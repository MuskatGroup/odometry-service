name: release-checks

on: [push, pull_request]

jobs:
  style:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check python tests ros2_ws/src/odometry_node ros2_ws/src/odometry_python tools

  ros:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build reserve
      - run: docker compose --profile test run --rm --no-deps ros-tests
      - run: >-
          docker compose run --rm --no-deps reserve bash -lc
          "source /opt/ros/humble/setup.bash && cd /workspace/ros2_ws &&
          colcon --log-base /tmp/log build --build-base /tmp/build
          --install-base /tmp/install --executor sequential"
