[project]
name = "odometry-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["odometry-core", "odometry-geometry", "odometry-io", "odometry-lab"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.11,<1"]
analysis = [
    "ipykernel>=7,<8",
    "jupyterlab>=4,<5",
    "matplotlib>=3.10,<4",
    "pandas>=2.3,<3",
    "pyproj>=3.7,<4",
    "rosbags>=0.11,<0.12",
    "seaborn>=0.13,<0.14",
]

[tool.uv.workspace]
members = ["python/*"]

[tool.uv.sources]
odometry-core = { workspace = true }
odometry-geometry = { workspace = true }
odometry-io = { workspace = true }
odometry-lab = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["check-code"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["tests/check-code"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
