[project]
name = "reserve-odometry-workspace"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["odometry-core", "odometry-geometry", "odometry-io"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.uv.workspace]
members = ["python/odometry_core", "python/odometry_geometry", "python/odometry_io"]

[tool.uv.sources]
odometry-core = { workspace = true }
odometry-geometry = { workspace = true }
odometry-io = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["check-code"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["tests/check-code"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
