[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odometry-service"
version = "0.1.0"
description = "Configurable input adapters and reproducible odometry integration harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
odometry-io = "odometry_io.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
