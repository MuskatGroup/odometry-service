[project]
name = "odometry-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["odometry-core", "odometry-io", "odometry-lab"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.11,<1"]

[tool.uv.workspace]
members = ["python/*"]

[tool.uv.sources]
odometry-core = { workspace = true }
odometry-io = { workspace = true }
odometry-lab = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
